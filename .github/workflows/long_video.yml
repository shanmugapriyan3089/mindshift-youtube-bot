name: Long video — make + schedule

# Fully automatic: renders the next pending long story (prototype/long_*/ without upload.json) and uploads it
# into the next Sunday 18:00 IST slot, with chapters and a thumbnail.
# Triggers: the weekly writer's push of a new long story.json, or Saturday 17:00 IST as a retry (the Shorts maker rarely
# runs then, so the channel voice's free TTS quota is unused). The first chunk picks the TTS model; the whole video keeps it.
# Runs on Windows (the hand-lettering fonts Ink Free / Segoe Print ship with Windows).
on:
  schedule:
    - cron: '30 11 * * 6'        # Saturday 17:00 IST (after the Gemini quota reset at 13:30 IST)
  push:
    paths: ['prototype/long_*/story.json']
  workflow_dispatch:

concurrency:
  group: long-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for pending long videos
        id: pending
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import sys; sys.path.insert(0, 'prototype')
          from run_pending_long import pending
          print('count=' + str(len(pending())))
          EOF

      - name: Install tools
        if: steps.pending.outputs.count != '0'
        run: |
          choco install ffmpeg -y --no-progress > /dev/null
          pip install -q requests python-dotenv google-api-python-client google-auth google-auth-oauthlib faster-whisper numpy pillow
          npm ci --prefix tools/animate --no-audit --no-fund
          cd tools/animate && npx playwright install chromium

      - name: Restore credentials
        if: steps.pending.outputs.count != '0'
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > youtube_token.pickle
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json

      - name: Make and schedule the long video
        if: steps.pending.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRETS_PATH: client_secrets.json
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
          HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
        run: python -u prototype/run_pending_long.py

      - name: Publish the Instagram teaser as a GitHub Release (source for the Reel)
        if: success() && steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for up in $(git status --porcelain -- 'prototype/long_*/upload.json' | awk '{print $2}'); do
            folder=$(basename "$(dirname "$up")"); slug=${folder#long_}
            cp "prototype/LONGTEASER_${folder}.mp4" "${slug}-teaser.mp4"
            gh release create "long-${slug}" "${slug}-teaser.mp4" --title "Long video teaser: ${slug}" --notes "Vertical teaser of the long video (source for Instagram cross-posting)." || true
          done

      - name: Keep the rendered video as an artifact
        if: always() && steps.pending.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: long-video
          path: |
            prototype/LONG_*.mp4
            prototype/LONGTEASER_*.mp4
            prototype/long_*/thumbnail.jpg
            prototype/long_*/look.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit timing + upload records
        if: always() && steps.pending.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prototype/
          git diff --cached --quiet || git commit -m "chore: long video made + scheduled [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep $((i*5)); done || true
