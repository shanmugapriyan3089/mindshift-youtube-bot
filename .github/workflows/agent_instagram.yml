name: Instagram Reels — cross-post story Shorts

# After a story Short goes public on YouTube (Mon/Wed/Fri 19:00 IST), post it as an Instagram Reel.
# The video comes from the GitHub Release "short-<slug>" that story_shorts.yml creates.
on:
  schedule:
    - cron: '40 13 * * *'       # daily 19:10 IST — 10 min after the YouTube publish slot
  push:
    paths: ['.github/workflows/agent_instagram.yml', 'prototype/post_instagram.py']
  workflow_dispatch:

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q requests

      - name: Check Instagram access
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python prototype/post_instagram.py --check

      - name: Post the next public Short as a Reel
        if: github.event_name != 'push'
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python prototype/post_instagram.py

      - name: Commit Instagram records
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prototype/
          git diff --cached --quiet || git commit -m "chore: Short cross-posted to Instagram [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep $((i*5)); done || true
