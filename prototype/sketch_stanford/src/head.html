<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisoner 8612</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1a17; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  PRISONER 8612 — 9:16, 75s @ 24fps, sketchbook style, voice-led (narration from the story-POV prototype).
//  The Stanford Prison Experiment told to "you", prisoner 8612. One hero (terracotta) across 9 hard-cut eras.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 77.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive';
const CX = 540;

// scene starts = narration sentence starts (voice is the clock)
const S = [0, 9.64, 15.79, 27.31, 35.91, 41.79, 48.14, 54.34, 67.5, 77.0];
// spoken-word cues (faster-whisper word times)
const CUE = { fifteen: 4.96, arrested: 13.08, number: 22.22, n8612: 25.42, uniform: 31.02, rebel: 37.34, fire: 39.84,
              scream: 44.0, letgo: 46.92, shut: 51.56, proof: 56.16, but: 59.1, coached: 61.78, n8612b: 63.88, faked: 65.4,
              someone: 72.4 };

const ERA_LIST = [
  [S[0], S[1], () => sceneAd()],
  [S[1], S[2], () => sceneArrest()],
  [S[2], S[3], () => sceneNumber()],
  [S[3], S[4], () => sceneGuard()],
  [S[4], S[5], () => sceneRebel()],
  [S[5], S[6], () => sceneOut()],
  [S[6], S[7], () => sceneShut()],
  [S[7], S[8], () => sceneTapes()],
  [S[8], S[9], () => sceneYou()],
];
const SHOT_NAMES = ['ad', 'arrest', '8612', 'guard', 'rebel', 'hour36', 'shutdown', 'tapes', 'you'];
const SHOTS = ERA_LIST.map(([t0, t1], i) => [SHOT_NAMES[i], i, t0, t1, SHOT_NAMES[i]]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'voice-led',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: S.slice(1, -1),
  morphs: [],
  cues: CUE,
  acts: [
    { name: '1 Setup', role: 'build', t0: 0, t1: S[3] },
    { name: '2 Prison', role: 'journey', t0: S[3], t1: S[6] },
    { name: '3 Twist', role: 'peak', t0: S[6], t1: S[8] },
    { name: '4 You', role: 'gift', t0: S[8], t1: DURATION },
  ],
  board: SHOT_NAMES.map((n, i) => ({ t: (S[i] + S[i + 1]) / 2, title: n, sound: '', next: '' })),
  narration: [],
};
window.TIMELINE = TIMELINE;
